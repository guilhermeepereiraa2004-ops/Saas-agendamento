name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://tfquhfhmmnbwntmkfkdo.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_isolated_ci_fixture
      VITE_ONESIGNAL_APP_ID: 11111111-1111-4111-8111-111111111111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium user flows
        run: npm run test:browser
      - name: Safari engine and iOS flows
        env:
          AUDIT_BROWSER: webkit
          AUDIT_FILTER: 'Recuperação|iPhone|iOS|PWA: profissional restaura|Financeiro detalhado: clientes.*390|Logo:|cliente confirma origem'
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: |
            scratch/admin-audit/browser-results.json
            scratch/admin-audit/*.png
